<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RD → 3PL REROUTE · Daily Report</title>
<style>
  :root{
    --bg:#0a0f16; --panel:#0e1520; --panel2:#111a28; --line:#1c2a3e; --line2:#23354d;
    --hud:#37c8f0; --hud-dim:#1b6f8f; --cyan-glow:rgba(55,200,240,.14);
    --txt:#d7e3ef; --txt2:#8ba0b6; --txt3:#5c7089;
    --ok:#3ddc97; --warn:#f5b942; --dead:#f0687e;
    --cdek:#37c8f0; --x5:#b57bf0; --other:#5c8db8;
    --mono:"Cascadia Mono",Consolas,"JetBrains Mono",ui-monospace,monospace;
    --sans:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg)}
  body{color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.55;
       padding:26px clamp(14px,3.2vw,44px) 60px;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(900px 340px at 18% -6%, rgba(55,200,240,.07), transparent 60%),
      radial-gradient(700px 300px at 92% 0%, rgba(181,123,240,.05), transparent 60%);}
  .wrap{max-width:1280px;margin:0 auto;position:relative;z-index:1}

  /* English mono tags are decorative in zh/ru, redundant in en */
  html[lang="en"] .mono-tag{display:none}

  /* ── header ─────────────────────────────── */
  header{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;
    padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .h-left{display:flex;gap:14px;align-items:center}
  .sigil{width:42px;height:42px;border:1px solid var(--hud-dim);border-radius:8px;position:relative;
    background:linear-gradient(160deg,#10202f,#0b1420);flex:none}
  .sigil svg{position:absolute;inset:0;margin:auto}
  h1{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:.06em;color:#eaf4fc}
  h1 em{font-style:normal;color:var(--hud)}
  .sub{font-size:12px;color:var(--txt2);letter-spacing:.04em;margin-top:3px}
  .h-right{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .chip{font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:4px 11px;border-radius:999px;
    border:1px solid var(--line2);color:var(--txt2);background:var(--panel);white-space:nowrap}
  .chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);
    margin-right:7px;vertical-align:1px;box-shadow:0 0 6px var(--ok)}
  .chip .dot.amber{background:var(--warn);box-shadow:0 0 6px var(--warn)}

  /* language switcher */
  .lang{display:flex;align-items:center;gap:0;border:1px solid var(--line2);border-radius:999px;
    overflow:hidden;background:var(--panel)}
  .lang button{appearance:none;border:0;background:transparent;color:var(--txt2);cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:5px 13px;transition:background .18s,color .18s}
  .lang button+button{border-left:1px solid var(--line)}
  .lang button:hover{color:#cfe4f2}
  .lang button[aria-pressed="true"]{background:rgba(55,200,240,.16);color:var(--hud);
    box-shadow:inset 0 -2px 0 var(--hud)}
  .lang .globe{padding:5px 0 5px 11px;color:var(--txt3);display:flex;align-items:center}

  /* ── generic panel ──────────────────────── */
  section{margin-bottom:26px}
  .sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .sec-h .no{font-family:var(--mono);font-size:11px;color:var(--hud);letter-spacing:.12em;border:1px solid var(--hud-dim);
    padding:1px 7px;border-radius:4px;background:rgba(55,200,240,.06)}
  .sec-h h2{font-size:15.5px;font-weight:600;color:#e8f2fa;letter-spacing:.02em}
  .sec-h .mono-tag{font-family:var(--mono);font-size:11px;color:var(--txt3);letter-spacing:.08em}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
  .panel::before,.panel::after{content:"";position:absolute;width:10px;height:10px;pointer-events:none;opacity:.8}
  .panel::before{top:-1px;left:-1px;border-top:2px solid var(--hud);border-left:2px solid var(--hud);border-top-left-radius:10px}
  .panel::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--hud);border-right:2px solid var(--hud);border-bottom-right-radius:10px}

  /* ── KPI ────────────────────────────────── */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;position:relative}
  .kpi .lab{font-size:11.5px;color:var(--txt2);letter-spacing:.02em;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;padding-right:20px}
  .kpi .lab .zh{white-space:nowrap}
  .kpi .lab .mono-tag{font-family:var(--mono);font-size:9.5px;color:var(--txt3);letter-spacing:.08em;margin-left:auto}
  .kpi .val{font-family:var(--mono);font-size:29px;font-weight:700;color:#eef7ff;margin-top:6px;letter-spacing:.02em}
  .kpi .val small{font-size:12px;font-weight:400;color:var(--txt3);margin-left:5px}
  .kpi .tag{position:absolute;top:12px;right:14px;width:8px;height:8px;border-radius:2px;transform:rotate(45deg)}
  .kpi.total .tag{background:var(--hud)} .kpi.total{border-color:#20435a}
  .kpi.cdek .tag{background:var(--cdek)} .kpi.x5 .tag{background:var(--x5)}
  .kpi.sc .tag{background:var(--ok)} .kpi.hub .tag{background:var(--warn)} .kpi.rev .tag{background:var(--dead)}
  .kpi .hint{font-size:11px;color:var(--txt3);margin-top:4px;font-family:var(--mono)}

  /* ── daily table ────────────────────────── */
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt2);
    text-align:right;padding:10px 14px;border-bottom:1px solid var(--line2);background:var(--panel2);white-space:nowrap}
  thead th:first-child{text-align:left}
  tbody td{padding:9px 14px;text-align:right;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13.5px;color:#dcebf6;white-space:nowrap}
  tbody td:first-child{text-align:left;font-family:var(--sans)}
  tbody tr:hover{background:rgba(55,200,240,.04)}
  tbody tr.total-row td{background:rgba(55,200,240,.07);color:#eef7ff;font-weight:700;border-top:1px solid var(--line2)}
  td .z{color:var(--txt3)}
  .d-ok{color:var(--ok)} .d-warn{color:var(--warn)} .d-dead{color:var(--dead)}
  .pill{display:inline-block;font-size:10.5px;font-family:var(--mono);padding:1px 8px;border-radius:999px;
    border:1px solid currentColor;letter-spacing:.06em;white-space:nowrap}
  .datecell b{color:#eaf4fc;font-weight:600}

  /* ── chart ─────────────────────────────── */
  .chart-body{padding:18px 18px 10px}
  .bars{display:flex;align-items:flex-end;gap:clamp(8px,2.6vw,26px);height:170px;padding-top:22px}
  .bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:26px}
  .bwrap{width:70%;max-width:58px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;position:relative}
  .bseg{width:100%}
  .bseg.cdek{background:linear-gradient(180deg,#4fd4f5,#1d7ba0)}
  .bseg.x5{background:linear-gradient(180deg,#c996f7,#7a41b8)}
  .bseg.other{background:linear-gradient(180deg,#7fb0d8,#3d6a90)}
  .btop{font-family:var(--mono);font-size:11.5px;color:var(--hud);margin-bottom:5px;font-weight:600}
  .blab{font-family:var(--mono);font-size:11px;color:var(--txt2);margin-top:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;padding:0 2px 8px;font-size:12px;color:var(--txt2)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .legend .unit{margin-left:auto;color:var(--txt3);font-family:var(--mono);font-size:11px}
  .empty-chart{padding:34px 18px;text-align:center;color:var(--txt3);font-size:13px}

  /* ── split layout ───────────────────────── */
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:860px){.cols2{grid-template-columns:1fr}}
  .mini-h{font-size:13px;font-weight:600;color:#cfe4f2;letter-spacing:.02em;padding:12px 16px 0}
  .mini-h .mono-tag{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-left:8px;letter-spacing:.08em}
  .prefix-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:12px 16px 8px;background:var(--panel2)}
  .prefix-bar i{height:100%}
  .prefix-legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:2px 16px 14px;font-size:12px;color:var(--txt2)}
  .prefix-legend b{font-family:var(--mono);color:#dcebf6;font-weight:600;margin-right:4px}
  .prefix-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
  .prefix-legend--hub{display:block;padding:2px 16px 14px;gap:0}
  .pl-row{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:baseline;
    padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .pl-row:last-child{border-bottom:0}
  .pl-key b{font-family:var(--mono);color:#eaf4fc;font-weight:600;letter-spacing:.04em}
  .pl-hub{color:var(--txt);font-family:var(--mono);font-size:12px;letter-spacing:.01em;word-break:break-word}
  .pl-num{color:var(--txt2);font-family:var(--mono);font-size:12px;white-space:nowrap}
  @media(max-width:520px){.pl-row{grid-template-columns:66px 1fr;gap:6px 8px}.pl-num{grid-column:2;text-align:right}}
  .empty-state{padding:26px 18px 24px;text-align:center}
  .empty-state .ico{font-family:var(--mono);color:var(--warn);letter-spacing:.2em;font-size:11px;margin-bottom:8px}
  .empty-state p{font-size:13px;color:var(--txt2);max-width:560px;margin:0 auto;line-height:1.65}
  .empty-state .plan{margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--txt3);line-height:1.6}

  /* ── notes / footer ─────────────────────── */
  .notes{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
  .notes li{list-style:none;font-size:12.5px;color:var(--txt2);padding-left:18px;position:relative;margin-bottom:7px;line-height:1.65}
  .notes li:last-child{margin-bottom:0}
  .notes li::before{content:"▸";position:absolute;left:2px;color:var(--hud-dim);font-size:11px;top:2px}
  .notes b{color:#d5e6f2;font-weight:600}
  .notes a{color:var(--hud);text-decoration:none;border-bottom:1px dashed var(--hud-dim)}
  footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;
    justify-content:space-between;font-size:11.5px;color:var(--txt3);font-family:var(--mono);letter-spacing:.04em}

  /* ── click-for-detail ───────────────────── */
  .kpi.clickable{cursor:pointer;transition:border-color .18s,background .18s}
  .kpi.clickable:hover{border-color:var(--hud-dim);background:var(--panel2)}
  td.click,td.dayclick{cursor:pointer;position:relative}
  td.click:hover,td.dayclick:hover{background:rgba(55,200,240,.1)}
  td.click::after{content:"›";position:absolute;right:4px;top:50%;transform:translateY(-50%);
    color:var(--hud);opacity:0;font-family:var(--mono);transition:opacity .15s}
  td.click:hover::after{opacity:.8}
  .bcol.clickable{cursor:pointer;border-radius:6px;padding:2px 0;transition:background .15s}
  .bcol.clickable:hover{background:rgba(55,200,240,.06)}
  .pl-row.clickable{cursor:pointer;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:6px;transition:background .15s}
  .pl-row.clickable:hover{background:rgba(55,200,240,.07)}
  .pl-row.clickable .pl-num::after{content:" ›";color:var(--hud)}

  /* ── QC watchlist ─────────────────────── */
  .qc-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-2px 0 12px}
  .chip .dot.red{background:var(--dead);box-shadow:0 0 6px var(--dead)}
  .qc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  .qc-card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--txt3);border-radius:10px;padding:13px 16px 12px;position:relative}
  .qc-card.p0{border-left-color:var(--dead)}
  .qc-card.p1{border-left-color:var(--warn)}
  .qc-badge{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;padding:2px 8px;border-radius:999px;border:1px solid currentColor;margin-bottom:8px}
  .qc-card.p0 .qc-badge{color:var(--dead);background:rgba(240,104,126,.08)}
  .qc-card.p1 .qc-badge{color:var(--warn);background:rgba(245,185,66,.08)}
  .qc-hub{font-size:14px;font-weight:600;color:#eaf4fc;letter-spacing:.01em}
  .qc-who{font-family:var(--mono);font-size:10.5px;color:var(--txt2);margin-top:2px;letter-spacing:.05em}
  .qc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .qc-tag{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--txt2);border:1px solid var(--line2);background:var(--panel2);border-radius:6px;padding:3px 8px;white-space:nowrap}
  .qc-tag b{color:#eef7ff;font-weight:600;margin-left:5px}
  .qc-tag.hot b{color:var(--dead)} .qc-tag.warm b{color:var(--warn)}
  .qc-note{font-size:12px;color:var(--txt2);line-height:1.6;margin-top:9px}
  .qc-clean{padding:12px 16px 14px}
  .qc-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .qc-pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--txt2);border:1px solid var(--line2);border-radius:999px;padding:4px 11px;background:var(--panel2)}
  .qc-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 5px var(--ok)}
  .qc-pill.click{cursor:pointer;transition:border-color .15s,color .15s}
  .qc-pill.click:hover{border-color:var(--hud-dim);color:#cfe4f2}
  .qc-pill b{color:var(--ok);font-weight:600}
  .qc-foot{font-size:11px;color:var(--txt3);margin-top:12px;line-height:1.7}
  .qc-src{color:var(--hud);text-decoration:none;border-bottom:1px dashed var(--hud-dim)}

  /* ── detail modal ───────────────────────── */
  #modal{position:fixed;inset:0;z-index:50;display:none}
  #modal.open{display:flex}
  .mbg{position:absolute;inset:0;background:rgba(4,8,14,.72);backdrop-filter:blur(3px)}
  .mbox{position:relative;margin:auto;width:min(920px,94vw);max-height:86vh;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line2);border-radius:12px;overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.55)}
  .mbox::before{content:"";position:absolute;top:-1px;left:-1px;width:14px;height:14px;
    border-top:2px solid var(--hud);border-left:2px solid var(--hud);border-top-left-radius:12px;pointer-events:none}
  .mbox::after{content:"";position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;
    border-bottom:2px solid var(--hud);border-right:2px solid var(--hud);border-bottom-right-radius:12px;pointer-events:none}
  .m-head{padding:14px 18px 0}
  .m-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .m-no{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--hud);
    border:1px solid var(--hud-dim);padding:1px 8px;border-radius:4px;background:rgba(55,200,240,.06)}
  .mx{appearance:none;background:transparent;border:1px solid var(--line2);color:var(--txt2);width:26px;height:26px;
    border-radius:6px;cursor:pointer;font-family:var(--mono);line-height:1;flex:none;transition:border-color .15s,color .15s}
  .mx:hover{border-color:var(--hud-dim);color:var(--hud)}
  .m-title{font-size:15.5px;font-weight:600;color:#eaf4fc;margin-top:8px;letter-spacing:.02em}
  .m-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
  .m-chips .chip{font-size:10.5px}
  .m-chips .chip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
  .m-chips .chip .i-cdek{background:var(--cdek)} .m-chips .chip .i-x5{background:var(--x5)}
  .m-chips .chip .i-other{background:var(--other)} .m-chips .chip .i-sc{background:var(--ok)}
  .m-chips .chip .i-hub{background:var(--warn)} .m-chips .chip .i-rev{background:var(--dead)}
  .m-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:0 18px 12px;border-bottom:1px solid var(--line)}
  .m-search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:7px;
    padding:6px 11px;background:var(--panel2);transition:border-color .15s}
  .m-search:focus-within{border-color:var(--hud-dim)}
  .m-search svg{color:var(--txt3);flex:none}
  .m-search input{flex:1;background:transparent;border:0;outline:0;color:var(--txt);font-family:var(--mono);font-size:12.5px}
  .m-search input::placeholder{color:var(--txt3)}
  .mbtn{appearance:none;border:1px solid var(--line2);background:var(--panel2);color:var(--txt2);cursor:pointer;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;padding:6px 13px;border-radius:7px;transition:border-color .15s,color .15s;white-space:nowrap}
  .mbtn:hover{border-color:var(--hud-dim);color:var(--hud)}
  .mbtn.primary{border-color:var(--hud-dim);color:var(--hud);background:rgba(55,200,240,.08)}
  .m-body{overflow:auto;flex:1}
  .m-body table thead th{position:sticky;top:0;z-index:1}
  .m-foot{padding:9px 18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;
    color:var(--txt3);letter-spacing:.03em;background:var(--panel2)}
  .m-hub{font-family:var(--sans)!important;text-align:left!important;max-width:270px;overflow:hidden;text-overflow:ellipsis}
  th.ta-l,td.ta-l{text-align:left!important}
  .p-cdek{color:var(--cdek)} .p-x5{color:var(--x5)} .p-other{color:var(--other)} .p-na{color:var(--txt3)}
  .m-empty{padding:42px 18px;text-align:center;color:var(--txt3);font-size:13px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="h-left">
    <div class="sigil">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <path d="M4 18 L13 5 L22 18" stroke="#37c8f0" stroke-width="1.7" stroke-linecap="round"/>
        <circle cx="13" cy="5.6" r="1.9" fill="#37c8f0"/>
        <path d="M7.2 18 H18.8" stroke="#8ba0b6" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M15.5 13 L19.5 15.6 L16.2 17.4" stroke="#f5b942" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <h1><span data-i18n="titleA">RD → 3PL</span> <em data-i18n="titleB">REROUTE</em> <span data-i18n="titleC"></span></h1>
      <div class="sub" data-i18n="subtitle"></div>
    </div>
  </div>
  <div class="h-right">
    <div class="lang" role="group" aria-label="Language">
      <span class="globe"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c1.7 1.8 2.6 4 2.6 6.2S9.7 12.4 8 14.2C6.3 12.4 5.4 10.2 5.4 8S6.3 3.6 8 1.8z"/></svg></span>
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="zh" aria-pressed="false">中文</button>
      <button data-lang="ru" aria-pressed="false">RU</button>
    </div>
    <div class="chips">
      <div class="chip"><span class="dot"></span><span data-i18n="chip_gen"></span> <span id="gen-time">—</span></div>
      <div class="chip"><span class="dot amber"></span><span data-i18n="chip_latest"></span> <span id="latest-date">—</span></div>
    </div>
  </div>
</header>

<section>

let LANG = 'en';
try{ const s=localStorage.getItem('reroute_lang'); if(s && I18N[s]) LANG=s; }catch(e){}
const t = k => { const v = I18N[LANG][k]; return v===undefined ? I18N.en[k] : v; };
const setLang = l => { LANG=l; try{ localStorage.setItem('reroute_lang',l) }catch(e){}; render(); };
const hubName = p => HUBMAP[p] || t('unknown_hub');
const fmt = n => (n==null?0:n).toLocaleString('en-US');
const num = (n,u) => fmt(n)+' '+(u===false?'':t('unit'));

/* ── derived data ─────────────────────────── */
const days = (DATA.days||[]).slice().sort((a,b)=>a.date.localeCompare(b.date,undefined,{numeric:true}));
const sum = k => days.reduce((s,d)=>s+(d[k]?.total||0),0);
const sum3 = (k,p) => days.reduce((s,d)=>s+(d[k]?.[p]||0),0);
const T = { sc:sum('sc'), hub:sum('hub'), rev:sum('rev') };
T.all = T.sc+T.hub+T.rev;
T.cdek = sum3('sc','cdek')+sum3('hub','cdek')+sum3('rev','cdek');
T.x5   = sum3('sc','x5')+sum3('hub','x5')+sum3('rev','x5');
T.other= sum3('sc','other')+sum3('hub','other')+sum3('rev','other');
T.done = ['sc','hub','rev'].reduce((s,k)=>s+days.reduce((a,d)=>a+(d[k]?.done||0),0),0);

function render(){
  document.documentElement.lang = LANG;
  document.title = t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n'); const v = t(k);
    if(typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('.lang button').forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.lang===LANG)));

  document.getElementById('gen-time').textContent = DATA.generatedAt;
  document.getElementById('latest-date').textContent = days.length ? days[days.length-1].date : '—';
  document.getElementById('foot-gen').textContent = t('foot_gen')(DATA.generatedAt);

  /* KPI */
  const hasDetail = DETAIL && DETAIL.days && DETAIL.days.length;
  const kpiDefs = [
    {cls:'total', dt:'all',  lab:t('k_total'), en:t('e_total'), val:T.all, hint:t('h_total')(fmt(T.done),fmt(T.all-T.done))},
    {cls:'cdek',  dt:'cdek', lab:t('k_cdek'),  en:t('e_cdek'),  val:T.cdek, hint:t('h_cdek')},
    {cls:'x5',    dt:'x5',   lab:t('k_x5'),    en:t('e_x5'),    val:T.x5,   hint:t('h_x5')},
    {cls:'sc',    dt:'sc',   lab:t('k_sc'),    en:t('e_sc'),    val:T.sc,   hint:t('h_sc')},
    {cls:'hub',   dt:'hub',  lab:t('k_hub'),   en:t('e_hub'),   val:T.hub,  hint:t('h_hub')},
    {cls:'rev',   dt:'rev',  lab:t('k_rev'),   en:t('e_rev'),   val:T.rev,  hint:t('h_rev')}
  ];
  document.getElementById('kpis').innerHTML = kpiDefs.map(k=>
    `<div class="kpi ${k.cls}${hasDetail&&k.val?' clickable':''}"${hasDetail&&k.val?` data-dt="${k.dt}" title="${t('d_click')}"`:''}><div class="tag"></div>
     <div class="lab"><span class="zh">${k.lab}</span><span class="mono-tag">${k.en}</span></div>
     <div class="val">${fmt(k.val)}<small>${t('unit')}</small></div>
     <div class="hint">${k.hint}</div></div>`).join('');

  /* day table */
  const head = `<thead><tr>
    <th>${t('th_date')}</th><th>${t('th_sc')}</th><th>${t('th_cdek')}</th><th>${t('th_x5')}</th>
    <th>${t('th_hub')}</th><th>${t('th_rev')}</th><th>${t('th_daytotal')}</th>
    <th>${t('th_done')}</th><th>${t('th_pend')}</th><th>${t('th_status')}</th></tr></thead>`;
  const rows = days.map(d=>{
    const tot=(d.sc?.total||0)+(d.hub?.total||0)+(d.rev?.total||0);
    const done=(d.sc?.done||0)+(d.hub?.done||0)+(d.rev?.done||0);
    const pend=tot-done;
    const stat = tot===0 ? `<span class="pill" style="color:var(--txt3)">${t('st_empty')}</span>`
      : pend===0 ? `<span class="pill" style="color:var(--ok)">${t('st_done')}</span>`
      : `<span class="pill" style="color:var(--warn)">${t('st_proc')}</span>`;
    const ck=(dt,ok)=> ok&&hasDetail ? ` class="click" data-dt="${dt}" data-dl="${d.date}" title="${t('d_click')}"` : '';
    const z=v=>v?fmt(v):'<span class="z">0</span>';
    return `<tr><td class="datecell dayclick${hasDetail&&tot?' click':''}"${hasDetail&&tot?` data-dt="all" data-dl="${d.date}" title="${t('d_click')}"`:''}><b>${d.date}</b></td>
      <td${ck('sc',d.sc?.total)}>${z(d.sc?.total)}</td>
      <td${ck('cdek',d.sc?.cdek)}>${z(d.sc?.cdek)}</td>
      <td${ck('x5',d.sc?.x5)}>${z(d.sc?.x5)}</td>
      <td${ck('hub',d.hub?.total)}>${z(d.hub?.total)}</td>
      <td${ck('rev',d.rev?.total)}>${z(d.rev?.total)}</td>
      <td${hasDetail&&tot?` class="click" data-dt="all" data-dl="${d.date}" title="${t('d_click')}"`:''}><b style="color:#eef7ff">${fmt(tot)}</b></td>
      <td class="d-ok${hasDetail&&done?' click':''}"${hasDetail&&done?` data-dt="done" data-dl="${d.date}" title="${t('d_click')}"`:''}>${z(done)}</td>
      <td class="${pend?'d-warn':''}${pend&&hasDetail?' click':''}"${pend&&hasDetail?` data-dt="pend" data-dl="${d.date}" title="${t('d_click')}"`:''}>${z(pend)}</td><td>${stat}</td></tr>`;
  }).join('');
  const totalRow = `<tr class="total-row"><td>${t('th_total')}</td>
    <td${hasDetail&&T.sc?` class="click" data-dt="sc"`:''}>${fmt(T.sc)}</td>
    <td${hasDetail&&sum3('sc','cdek')?` class="click" data-dt="cdek"`:''}>${fmt(sum3('sc','cdek'))}</td>
    <td${hasDetail&&sum3('sc','x5')?` class="click" data-dt="x5"`:''}>${fmt(sum3('sc','x5'))}</td>
    <td${hasDetail&&T.hub?` class="click" data-dt="hub"`:''}>${fmt(T.hub)}</td>
    <td${hasDetail&&T.rev?` class="click" data-dt="rev"`:''}>${fmt(T.rev)}</td>
    <td${hasDetail&&T.all?` class="click" data-dt="all"`:''}>${fmt(T.all)}</td>
    <td${hasDetail&&T.done?` class="click" data-dt="done"`:''}>${fmt(T.done)}</td>
    <td${hasDetail&&T.all-T.done?` class="click" data-dt="pend"`:''}>${fmt(T.all-T.done)}</td><td></td></tr>`;
  document.getElementById('day-table').innerHTML = head + '<tbody>'
    + (rows || `<tr><td colspan="10" style="text-align:center;color:var(--txt3)">${t('th_empty')}</td></tr>`)
    + totalRow + '</tbody>';

  /* bars */
  if(days.length){
    document.getElementById('chart-body').style.display='';
    document.getElementById('bars-empty').style.display='none';
    const maxV = Math.max(...days.map(d=>(d.sc?.total||0)+(d.hub?.total||0)+(d.rev?.total||0)),1);
    document.getElementById('bars').innerHTML = days.map(d=>{
      const tot=(d.sc?.total||0)+(d.hub?.total||0)+(d.rev?.total||0);
      const h = Math.max(4, tot/maxV*100);
      const parts=[['cdek',(d.sc?.cdek||0)+(d.hub?.cdek||0)],['x5',(d.sc?.x5||0)+(d.hub?.x5||0)],['other',(d.sc?.other||0)+(d.hub?.other||0)]];
      const segs=parts.filter(p=>p[1]>0).map(p=>`<div class="bseg ${p[0]}" style="height:${p[1]/Math.max(tot,1)*100}%"></div>`).join('');
      const ck = tot&&hasDetail ? ` clickable" data-dt="all" data-dl="${d.date}" title="${t('d_click')}` : '';
      return `<div class="bcol${ck}"><div class="btop">${fmt(tot)}</div>
        <div class="bwrap" style="height:${h}%">${segs}</div>
        <div class="blab">${d.date}</div></div>`;
    }).join('');
  } else {
    document.getElementById('chart-body').style.display='none';
    document.getElementById('bars-empty').style.display='block';
  }

  /* SC panel */
  (()=>{
    const p=document.getElementById('sc-panel');
    const hd=`<div class="mini-h">${t('sc_title')}<span class="mono-tag">${t('sc_sub')}</span></div>`;
    if(!T.sc){ p.innerHTML=hd+`<div class="empty-state"><div class="ico">▮ NO DATA</div><p>${t('chart_empty')}</p></div>`; return; }
    let o = hd+`<table style="margin-top:8px"><thead><tr><th>${t('th_date')}</th><th>${t('sc_th_reg')}</th>
      <th>${t('th_done')}</th><th>${t('th_pend')}</th><th>${t('sc_th_share')}</th></tr></thead><tbody>`;
    days.forEach(d=>{
      const tot=(d.sc?.total||0); if(!tot) return;
      const dayAll=tot+(d.hub?.total||0)+(d.rev?.total||0);
      const dScDone=d.sc.done||0, dPend=tot-dScDone;
      const ck=(dt,ok,extra)=> ok&&hasDetail&&dt
        ? ` class="click${extra?' '+extra:''}" data-dt="${dt}" data-dl="${d.date}" title="${t('d_click')}"`
        : (extra?` class="${extra}"`:'');
      o+=`<tr><td${ck('sc',1)}>${d.date}</td><td${ck('sc',1)}>${fmt(tot)}</td>
          <td${ck('sc-done',dScDone,'d-ok')}>${fmt(dScDone)}</td>
          <td${ck('sc-pend',dPend,dPend?'d-warn':undefined)}>${fmt(dPend)}</td>
          <td>${dayAll?Math.round(tot/dayAll*100):0}%</td></tr>`;
    });
    const scDone=days.reduce((s,d)=>s+(d.sc?.done||0),0);
    const ckAll=(dt,ok)=> ok&&hasDetail ? ` class="click" data-dt="${dt}" title="${t('d_click')}"` : '';
    o+=`<tr class="total-row"><td>${t('sc_cum')}</td><td${ckAll('sc',T.sc)}>${fmt(T.sc)}</td><td${ckAll('sc-done',scDone)}>${fmt(scDone)}</td><td${ckAll('sc-pend',T.sc-scDone)}>${fmt(T.sc-scDone)}</td><td>—</td></tr></tbody></table>`;
    const O={}; days.forEach(d=>Object.entries(d.sc?.origin||{}).forEach(([k,v])=>O[k]=(O[k]||0)+v));
    const keys=Object.keys(O).sort((a,b)=>O[b]-O[a]);
    if(keys.length){
      const pal=['#37c8f0','#3ddc97','#f5b942','#b57bf0','#5c8db8','#f0687e','#7de3c8'];
      o+=`<div class="mini-h" style="padding-top:16px">${t('pf_title')}<span class="mono-tag">${t('pf_sub')}</span></div><div class="prefix-bar">`
        + keys.map((k,i)=>`<i style="width:${O[k]/T.sc*100}%;background:${pal[i%pal.length]}" title="${k} · ${hubName(k)}"></i>`).join('')
        + '</div><div class="prefix-legend prefix-legend--hub">'
        + keys.map((k,i)=>`<div class="pl-row${hasDetail?' clickable':''}"${hasDetail?` data-dt="pref" data-pf="${k}" title="${t('d_click')}"`:''}><span class="pl-key"><i style="background:${pal[i%pal.length]}"></i><b>${k}</b></span>`
          + `<span class="pl-hub">${hubName(k)}</span><span class="pl-num">${num(O[k])} · ${(O[k]/T.sc*100).toFixed(1)}%</span></div>`).join('')
        + '</div>';
    }
    p.innerHTML=o;
  })();

  /* HUB panel */
  (()=>{
    const p=document.getElementById('hub-panel');
    const hd=`<div class="mini-h">${t('hub_title')}<span class="mono-tag">${t('hub_sub')}</span></div>`;
    if(!T.hub){
      p.innerHTML=hd+`<div class="empty-state"><div class="ico">${t('hub_standby')}</div>
        <p>${t('hub_desc')}</p><div class="plan">${t('hub_plan')}</div></div>`;
      return;
    }
    let o=hd+`<table style="margin-top:8px"><thead><tr><th>${t('th_date')}</th><th>${t('sc_th_reg')}</th>
      <th>CDEK</th><th>X5</th><th>${t('th_done')}</th><th>${t('hub_th_conf')}</th></tr></thead><tbody>`;
    days.forEach(d=>{ if(!d.hub?.total) return;
      const ck=hasDetail?` class="click" data-dt="hub" data-dl="${d.date}" title="${t('d_click')}"`:'';
      o+=`<tr><td${ck}>${d.date}</td><td${ck}>${fmt(d.hub.total)}</td><td>${fmt(d.hub.cdek)}</td><td>${fmt(d.hub.x5)}</td>
        <td class="d-ok">${fmt(d.hub.done)}</td><td>${fmt(d.hub.confirmed)}</td></tr>`;});
    p.innerHTML=o+'</tbody></table>';
  })();

  /* reverse panel */
  (()=>{
    const p=document.getElementById('rev-panel');
    const hd=`<div class="mini-h">${t('rev_title')}<span class="mono-tag">${t('rev_sub')}</span></div>`;
    if(!T.rev){
      p.innerHTML=hd+`<div class="empty-state" style="padding-bottom:20px"><div class="ico">${t('rev_standby')}</div><p>${t('rev_desc')}</p></div>`;
      return;
    }
    let o=hd+`<table style="margin-top:8px"><thead><tr><th>${t('th_date')}</th><th>${t('sc_th_reg')}</th>
      <th>${t('th_done')}</th><th>${t('th_pend')}</th></tr></thead><tbody>`;
    days.forEach(d=>{ if(!d.rev?.total) return;
      const ck=hasDetail?` class="click" data-dt="rev" data-dl="${d.date}" title="${t('d_click')}"`:'';
      o+=`<tr><td${ck}>${d.date}</td><td${ck}>${fmt(d.rev.total)}</td><td class="d-ok">${fmt(d.rev.done)}</td><td>${fmt(d.rev.pending)}</td></tr>`;});
    p.innerHTML=o+'</tbody></table>';
  })();

  /* QC watchlist */
  (()=>{
    document.getElementById('qc-date').textContent = QCX.date;
    const badge = p => p==='P0' ? t('qc_p0') : t('qc_p1');
    document.getElementById('qc-cards').innerHTML = QCX.flagged.map(c=>{
      const tags = c.tags.map(x=>`<span class="qc-tag${x.hot?' hot':(x.warm?' warm':'')}">${t('qc_t_'+x.k)}<b>${x.v}</b></span>`).join('');
      return `<div class="qc-card ${c.p.toLowerCase()}"><span class="qc-badge">${c.p} · ${badge(c.p)}</span>
        <div class="qc-hub">${c.hub}</div><div class="qc-who">${c.who}</div>
        <div class="qc-tags">${tags}</div>
        <div class="qc-note">${(c.note[LANG]||c.note.en)}</div></div>`;
    }).join('');
    document.getElementById('qc-clean').innerHTML = QCX.clean.map(c=>{
      const ck = hasDetail ? ` class="qc-pill click" data-dt="pref" data-pf="${c.pref}" title="${t('d_click')}"` : ' class="qc-pill"';
      return `<span${ck}><span class="dot"></span>${c.hub}<b>${fmt(c.n)}</b></span>`;
    }).join('');
    document.getElementById('qc-foot').innerHTML = t('qc_foot')(QCX.date, QCX.src);
  })();

  /* 3PL handover monitor table */
  (()=>{
    document.getElementById('mon-asof').textContent = MON.asOf||'—';
    const rows=(MON.rows||[]).slice().sort((a,b)=>a.date.localeCompare(b.date,undefined,{numeric:true})||a.loc.localeCompare(b.loc));
    const pendCls=(v,tot)=> v<tot ? ' class="d-warn"' : ' class="d-ok"';
    let h=`<thead><tr><th>${t('mon_th_date')}</th><th style="text-align:left">${t('mon_th_loc')}</th>
      <th>${t('mon_th_total')}</th><th>${t('mon_th_ship')}</th><th>${t('mon_th_asn')}</th><th>${t('mon_th_deliv')}</th></tr></thead><tbody>`;
    h += rows.map(r=>`<tr><td>${r.date}</td><td style="text-align:left;font-family:var(--sans)">${r.loc}</td>
      <td>${fmt(r.total)}</td>
      <td${pendCls(r.shipped,r.total)}>${fmt(r.shipped)}</td>
      <td${pendCls(r.asnY,r.total)}>${fmt(r.asnY)}</td>
      <td${pendCls(r.delivFilled,r.total)}>${fmt(r.delivFilled)}</td></tr>`).join('');
    const S={total:0,shipped:0,asnY:0,delivFilled:0};
    rows.forEach(r=>{S.total+=r.total;S.shipped+=r.shipped;S.asnY+=r.asnY;S.delivFilled+=r.delivFilled;});
    h+=`<tr class="total-row"><td>${t('th_total')}</td><td></td><td>${fmt(S.total)}</td><td>${fmt(S.shipped)}</td><td>${fmt(S.asnY)}</td><td>${fmt(S.delivFilled)}</td></tr></tbody>`;
    document.getElementById('mon-table').innerHTML=h;
    document.getElementById('mon-foot').innerHTML = t('mon_foot')(t('mon_src'));
  })();

  /* notes */
  const sep = LANG==='zh' ? '：' : ': ';
  document.getElementById('notes').innerHTML = ['n1','n2','n3','n4','n5','n6','n7']
    .map(k=>{ const [lead,body]=t(k); return `<li><b>${lead}</b>${sep}${body}</li>` }).join('');

  /* re-render detail modal if open (language switch) */
  if(curSpec) renderModal();
}

/* ── detail modal engine ────────────────── */
const PLABEL = { cdek:'CDEK', x5:'X5', other:'—' };
let curSpec = null;

function collectRows(scope, date, f){
  f = f||{};
  const out = [];
  const days = (DETAIL && DETAIL.days) || [];
  for(const dd of days){
    if(date && dd.date!==date) continue;
    const inc = k => (scope==='all' || scope===k);
    if(inc('sc')) (dd.sc||[]).forEach(r=>{
      const [o,p,done,by] = r;
      if(f.p && p!==f.p) return;
      if(f.pref && String(o).slice(0,4)!==f.pref) return;
      if(f.done!=null && (done?1:0)!==f.done) return;
      out.push({date:dd.date, order:o, p, done:!!done, hub:String(o).slice(0,4), by});
    });
    if(inc('hub')) (dd.hub||[]).forEach(r=>{
      const [o,p,done,by,conf] = r;
      if(f.p && p!==f.p) return;
      if(f.pref && String(o).slice(0,4)!==f.pref) return;
      if(f.done!=null && (done?1:0)!==f.done) return;
      out.push({date:dd.date, order:o, p, done:!!done, hub:String(o).slice(0,4), by, conf:!!conf});
    });
    if(inc('rev')) (dd.rev||[]).forEach(r=>{
      const [o,done] = r;
      if(f.p || f.pref) return;
      if(f.done!=null && (done?1:0)!==f.done) return;
      out.push({date:dd.date, order:o, p:null, done:!!done});
    });
  }
  return out;
}

function openDetail(spec){
  if(!spec.rows.length){ return; }   /* nothing registered → ignore */
  curSpec = spec;
  const inp = document.getElementById('modal-q'); inp.value='';
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal').setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  renderModal();
  setTimeout(()=>inp.focus(),30);
}

function closeDetail(){
  curSpec=null;
  const m=document.getElementById('modal');
  m.classList.remove('open'); m.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}

function modalRows(){
  const q = (document.getElementById('modal-q').value||'').trim().toLowerCase();
  const rows = curSpec.rows;
  return q ? rows.filter(r=>String(r.order).toLowerCase().includes(q)) : rows;
}

function renderModal(){
  if(!curSpec) return;
  const kind = curSpec.scope==='rev' ? 'rev' : 'fwd';     /* rev rows have no 3PL/Hub */
  const hasHub = kind==='fwd';
  const showDate = !curSpec.date;   /* cumulative view → add Date column */
  const cols = [];
  if(showDate) cols.push({c:t('d_date')});
  cols.push({c:t('d_order'), l:1});
  if(kind==='fwd') cols.push({c:t('d_3pl')});
  cols.push({c:t('d_status')});
  if(hasHub) cols.push({c:t('d_hub'), l:1});
  cols.push({c:t('d_by'), l:1});
  if(curSpec.scope==='hub') cols.push({c:t('d_conf')});

  const tr = modalRows();
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let h = '<thead><tr>'+cols.map(x=>`<th${x.l?' class="ta-l"':''}>${x.c}</th>`).join('')+'</tr></thead><tbody>';
  h += tr.map(r=>{
    let c = '';
    if(showDate) c += `<td>${r.date}</td>`;
    c += `<td class="ta-l">${esc(r.order)}</td>`;
    if(kind==='fwd') c += `<td class="p-${r.p||'other'}">${PLABEL[r.p]||'—'}</td>`;
    c += `<td class="${r.done?'d-ok':'d-warn'}">${kind==='rev'?(r.done?t('st_done'):t('st_proc')):(r.done?t('d_done'):t('d_pend'))}</td>`;
    if(hasHub) c += `<td class="m-hub" title="${esc(HUBMAP[r.hub]||'')}">${esc(HUBMAP[r.hub]||t('unknown_hub'))}</td>`;
    c += `<td class="ta-l">${esc(r.by||'—')}</td>`;
    if(curSpec.scope==='hub') c += `<td>${r.conf?`<span class="d-ok">${t('d_yes')}</span>`:`<span class="p-na">${t('d_no')}</span>`}</td>`;
    return '<tr>'+c+'</tr>';
  }).join('');
  h += '</tbody>';
  document.getElementById('modal-table').innerHTML = h;

  document.getElementById('modal-title').textContent = curSpec.title;
  const nDone = tr.filter(r=>r.done).length;
  const chips = [
    `<div class="chip"><span class="dot"></span>${t('d_of')(tr.length)}</div>`,
    `<div class="chip"><span class="dot"></span>${t('th_done')} ${fmt(nDone)}</div>`,
    `<div class="chip"><span class="dot amber"></span>${t('th_pend')} ${fmt(tr.length-nDone)}</div>`
  ];
  if(kind==='fwd'){
    ['cdek','x5','other'].forEach(p=>{
      const c = tr.filter(r=>r.p===p).length; if(c) chips.push(`<div class="chip"><i class="i-${p}"></i>${PLABEL[p]} ${fmt(c)}</div>`);
    });
  }
  document.getElementById('modal-chips').innerHTML = chips.join('');
  document.getElementById('modal-foot').textContent =
    (tr.length!==curSpec.rows.length ? t('d_showing')(tr.length)+' · ' : '') + (curSpec.sub||'');
}

/* CSV export of currently filtered rows */
function exportCSV(){
  if(!curSpec) return;
  const tr = modalRows();
  const showDate = !curSpec.date;
  const head = [];
  if(showDate) head.push('Date');
  head.push('Order','3PL','Status');
  if(curSpec.scope!=='rev') head.push('Hub');
  head.push('SubmittedBy');
  if(curSpec.scope==='hub') head.push('TransferConfirmed');
  const q = s => `"${String(s==null?'':s).replace(/"/g,'""')}"`;
  const lines = [head.map(q).join(',')];
  for(const r of tr){
    const a = [];
    if(showDate) a.push(r.date);
    a.push(r.order, r.p?PLABEL[r.p]:'N/A', r.done?'DONE':'PENDING');
    if(curSpec.scope!=='rev') a.push(r.p!==null?(HUBMAP[r.hub]||r.hub):'');
    a.push(r.by||'');
    if(curSpec.scope==='hub') a.push(r.conf?'YES':'NO');
    lines.push(a.map(q).join(','));
  }
  const blob = new Blob(['\ufeff'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const tag = (curSpec.date||'all')+'-'+curSpec.scope+(curSpec.filterTag?'-'+curSpec.filterTag:'');
  a.download = 'reroute-detail_'+tag.replace(/[^\w.-]/g,'_')+'.csv';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
}

/* spec builders */
function specOpen(scope, date, f, ft){
  const rows = collectRows(scope, date, f);
  if(!rows.length) return null;
  const parts=[];
  if(f && f.p) parts.push(PLABEL[f.p]);
  if(f && f.pref) parts.push(f.pref);
  if(f && f.done!=null) parts.push(f.done?t('d_done'):t('d_pend'));
  return {
    scope, date, rows, filterTag: ft,
    title: t('d_title')(parts.length?parts.join(' · '):t('th_total'), date||null),
    sub: (scope==='sc'?t('sc_title'):scope==='hub'?t('hub_title'):scope==='rev'?t('rev_title'):t('k_total'))
         +' · '+(date||t('sc_cum'))+' · '+DATA.generatedAt
  };
}

/* delegated clicks */
document.addEventListener('click', e=>{
  if(e.target.closest && e.target.closest('#modal-x, #modal-bg')){ closeDetail(); return; }
  const el = e.target.closest && e.target.closest('[data-dt]');
  if(!el || !DETAIL || !DETAIL.days || !DETAIL.days.length) return;
  const dt = el.dataset.dt, dl = el.dataset.dl || null;
  let scope, f = null, ft;
  if(dt==='all'){ scope='all'; }
  else if(dt==='cdek'){ scope='all'; f={p:'cdek'}; ft='cdek'; }
  else if(dt==='x5'){ scope='all'; f={p:'x5'}; ft='x5'; }
  else if(dt==='sc'){ scope='sc'; }
  else if(dt==='hub'){ scope='hub'; }
  else if(dt==='rev'){ scope='rev'; }
  else if(dt==='done'){ scope='all'; f={done:1}; ft='done'; }
  else if(dt==='pend'){ scope='all'; f={done:0}; ft='pending'; }
  else if(dt==='sc-done'){ scope='sc'; f={done:1}; ft='done'; }
  else if(dt==='sc-pend'){ scope='sc'; f={done:0}; ft='pending'; }
  else if(dt==='pref'){ scope='sc'; f={pref:el.dataset.pf}; ft=el.dataset.pf; }
  else return;
  const sp = specOpen(scope, dl, f, ft);
  if(sp) openDetail(sp);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && curSpec) closeDetail(); });
let qTimer=null;
document.getElementById('modal-q').addEventListener('input', ()=>{
  clearTimeout(qTimer); qTimer=setTimeout(renderModal,120);
});
document.getElementById('modal-csv').addEventListener('click', exportCSV);

document.querySelectorAll('.lang button').forEach(b=>
  b.addEventListener('click',()=>setLang(b.dataset.lang)));
render();
</script>
