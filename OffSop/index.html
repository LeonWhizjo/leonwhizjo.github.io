<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RU151 应急 · 线下履约指挥面板</title>
<style>
:root{
  --bg:#0a0e13; --card:#101823; --ink:#d8e3ee; --sub:#8298ab; --line:#1e2c3a;
  --amber:#ffb454; --amberbg:rgba(255,180,84,.09); --red:#ff5f56; --redbg:rgba(255,95,86,.10);
  --green:#3ddc84; --greenbg:rgba(61,220,132,.10); --blue:#4cc2ff; --bluebg:rgba(76,194,255,.10);
  --mono:Consolas,'SF Mono',Menlo,'Cascadia Mono','Courier New',monospace;
  --shadow:0 0 0 1px rgba(76,194,255,.05),0 10px 30px rgba(0,0,0,.45);
  --r:10px; --rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei","Noto Sans",Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;background-image:linear-gradient(rgba(76,194,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(76,194,255,.028) 1px,transparent 1px);background-size:34px 34px}
.wrap{max-width:1060px;margin:0 auto;padding:0 14px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:8px}
::-webkit-scrollbar-thumb{background:#22364a;border-radius:6px}
::-webkit-scrollbar-track{background:#0a0e13}

/* ===== header ===== */
header{position:sticky;top:0;z-index:50;background:rgba(10,14,19,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0}
.htitle{font-family:var(--mono);font-size:13.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;display:flex;align-items:center;gap:9px;color:#cfe2f2}
.hdot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(255,95,86,.16),0 0 12px rgba(255,95,86,.7);flex:none;animation:hp 2.4s ease-in-out infinite}
@keyframes hp{50%{box-shadow:0 0 0 6px rgba(255,95,86,.08),0 0 5px rgba(255,95,86,.4)}}
.hspacer{flex:1}
.seg{display:flex;background:#0d141c;border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:700;font-family:var(--mono);letter-spacing:.5px;color:var(--sub);cursor:pointer;white-space:nowrap}
.seg button.on{background:#16222f;color:var(--blue);box-shadow:inset 0 0 0 1px rgba(76,194,255,.45),0 0 10px rgba(76,194,255,.12)}
.seg.tseg button.on.t1{color:var(--amber);box-shadow:inset 0 0 0 1px rgba(255,180,84,.5),0 0 10px rgba(255,180,84,.12)}
.seg.tseg button.on.t2{color:var(--red);box-shadow:inset 0 0 0 1px rgba(255,95,86,.5),0 0 10px rgba(255,95,86,.14)}
.seg.tseg button.on.t3{color:var(--green);box-shadow:inset 0 0 0 1px rgba(61,220,132,.5),0 0 10px rgba(61,220,132,.12)}

/* ===== status banner ===== */
.banner{border-radius:var(--r);padding:16px 18px;margin:16px 0 6px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start;border:1px solid}
.banner .bic{font-size:26px;line-height:1.1;flex:none}
.banner h2{font-size:16.5px;margin-bottom:3px}
.banner p{font-size:13.5px;opacity:.86}
.banner.t1{background:linear-gradient(135deg,rgba(255,180,84,.16),rgba(255,180,84,.05));border-color:rgba(255,180,84,.45);color:#ffd9a0}
.banner.t2{background:linear-gradient(135deg,rgba(255,95,86,.17),rgba(255,95,86,.05));border-color:rgba(255,95,86,.5);color:#ffb8b2}
.banner.t3{background:linear-gradient(135deg,rgba(61,220,132,.15),rgba(61,220,132,.05));border-color:rgba(61,220,132,.45);color:#a9ecc8}

/* ===== nav chips ===== */
.nav{display:flex;gap:7px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;font-size:12.5px;font-weight:600;color:var(--sub);background:#0d141c;border:1px solid var(--line);border-radius:7px;padding:5px 12px}
.nav a:hover{color:var(--blue);text-decoration:none;border-color:rgba(76,194,255,.5)}

/* ===== sections ===== */
section{margin:30px 0;scroll-margin-top:96px}
.sec-h{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.sec-h .bar{width:5px;height:20px;border-radius:2px;background:linear-gradient(180deg,var(--blue),#155e85);box-shadow:0 0 8px rgba(76,194,255,.5)}
.sec-h h2{font-size:18px;font-weight:700;letter-spacing:.3px}
.sec-sub{font-size:13px;color:var(--sub);margin-bottom:14px}
.focus-tag{display:none;font-size:11px;font-weight:700;color:#fff;background:var(--red);border-radius:999px;padding:2px 9px;margin-left:2px;box-shadow:0 0 12px rgba(255,95,86,.55)}
section.focus{background:rgba(76,194,255,.045);border-radius:var(--r)}
section.focus .focus-tag{display:inline-block}
section.focus .sec-h h2{color:var(--red)}

/* ===== cards ===== */
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:860px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);box-shadow:var(--shadow);padding:15px}
.scard .ic{font-size:24px;margin-bottom:8px}
.scard h3{font-size:14.5px;margin-bottom:4px}
.scard p{font-size:12.5px;color:var(--sub)}

/* ===== pipeline ===== */
.pipe{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px 12px}
.pnode{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);box-shadow:var(--shadow);padding:12px 12px;position:relative}
.pnode .ic{font-size:22px}
.pnode h4{font-size:13.5px;margin:4px 0 3px}
.pnode p{font-size:11.5px;color:var(--sub);line-height:1.45}
.parrow{flex:none;width:26px;display:flex;align-items:center;justify-content:center;color:#2e4256;font-size:16px}
@media(max-width:700px){
  .pipe{flex-direction:column;overflow:visible}
  .parrow{width:auto;height:22px;transform:rotate(90deg)}
}

/* ===== stage cards & flow ===== */
.stage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.stage-h{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stage-h .sic{width:44px;height:44px;border-radius:10px;background:#152230;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.stage-h h3{font-size:16px}
.stage-h .own{font-size:12px;color:var(--sub);font-family:var(--mono)}
.stage-b{padding:16px 18px}
details.apps{margin-bottom:14px}
details.apps summary{font-size:12.5px;color:var(--sub);cursor:pointer;user-select:none;list-style:none;display:flex;align-items:center;gap:6px}
details.apps summary::-webkit-details-marker{display:none}
details.apps summary::before{content:"▸";transition:transform .15s;display:inline-block;font-size:11px}
details.apps[open] summary::before{transform:rotate(90deg)}
.appchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.appchip{font-size:11px;font-family:var(--mono);background:#0b1219;border:1px solid #23374a;border-radius:6px;padding:2.5px 8px;color:#9fc0da}
.appchip b{color:var(--blue);font-weight:650}

.flow{display:flex;flex-direction:column;align-items:stretch}
.farrow{width:2px;height:16px;background:#274058;margin:0 auto;position:relative;flex:none}
.farrow::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);border:5px solid transparent;border-top:6px solid #274058}
.fnode{width:100%}
.fnode.start{background:var(--bluebg);border:1px solid rgba(76,194,255,.45);color:#bfe6ff;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;text-align:center}
.fnode.rule{background:repeating-linear-gradient(45deg,rgba(255,95,86,.14) 0 10px,rgba(255,95,86,.05) 10px 20px);border:1px solid rgba(255,95,86,.5);color:#ffc9c4;border-radius:var(--rs);padding:10px 14px;font-size:13px;font-weight:600}
.fnode.out{background:#0d141c;border:1px dashed #2e4256;color:var(--sub);border-radius:var(--rs);padding:9px 14px;font-size:12.5px}
.fnode.step{display:flex;gap:12px;background:#0e1620;border:1px solid var(--line);border-radius:var(--rs);padding:11px 14px;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.fnum{width:26px;height:26px;border-radius:50%;background:#132130;border:1px solid rgba(76,194,255,.5);color:var(--blue);font-family:var(--mono);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.fbody{flex:1;min-width:0}
.fmeta{margin-bottom:3px}
.ftext{font-size:13.5px}
.frec{margin-top:6px;font-size:11.5px;color:var(--sub);display:inline-block;background:#0b1219;border:1px solid #23374a;border-radius:6px;padding:1.5px 8px}
.fnode.dec{background:var(--amberbg);border:1px solid rgba(255,180,84,.45);border-radius:var(--rs);padding:12px 14px}
.fq{font-size:13.5px;font-weight:650;color:#ffd9a0;margin-bottom:9px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.opt{background:#0e1620;border:1px solid #223548;border-radius:8px;padding:8px 11px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.olabel{flex:none;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-top:1px}
.olabel.yes{background:var(--greenbg);color:var(--green);border:1px solid rgba(61,220,132,.4)}
.olabel.no{background:var(--redbg);color:var(--red);border:1px solid rgba(255,95,86,.4)}
.olabel.alt{background:var(--bluebg);color:var(--blue);border:1px solid rgba(76,194,255,.4)}
.otext{color:#b9c7d4}

/* role badges */
.rb{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1.5px 7px;color:#fff;letter-spacing:.3px;margin-right:4px}
.rb-IC{background:#2b6cb0}.rb-TECH{background:#6b46c1}.rb-SORT{background:#c05621}
.rb-LINE{background:#2f855a}.rb-PUDO{background:#0e7490}.rb-CS{background:#b83280}
.rb-CPL{background:#4c51bf}.rb-DM{background:#975a16}.rb-SPOK{background:#4a5568}
.rb-ALL{background:#8a8272}

/* ===== first hour ===== */
.fh .fnode.step{background:#101a26}

/* ===== roles ===== */
.role{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);box-shadow:var(--shadow);padding:14px}
.role .code{width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex:none;letter-spacing:.5px;font-family:var(--mono)}
.role h4{font-size:14px;margin-bottom:2px}
.role .rd{font-size:12.5px;color:var(--sub)}
.role .ro{font-size:12px;margin-top:5px;color:#b9c7d4}
.role .ro b{font-weight:650}

/* ===== checklist ===== */
.ckbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ckbar .prog{flex:1;min-width:160px;height:8px;border-radius:99px;background:#1a2634;overflow:hidden}
.ckbar .prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2a9d68,var(--green));box-shadow:0 0 10px rgba(61,220,132,.5);transition:width .3s}
.ckbar .cnt{font-size:13px;font-weight:700;color:var(--green);font-family:var(--mono)}
.ck{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:opacity .2s}
.ck input{width:19px;height:19px;margin-top:1px;accent-color:var(--green);cursor:pointer;flex:none}
.ck .ct{font-size:13.5px;flex:1}
.ck .meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:700;border-radius:6px;padding:1.5px 8px;background:#141e2a;border:1px solid #23374a;color:var(--sub)}
.chip.dl{background:var(--bluebg);color:var(--blue);border-color:rgba(76,194,255,.35)}
.ck.done{opacity:.55}
.ck.done .ct{text-decoration:line-through}

/* ===== backfill timeline ===== */
.tl{position:relative;padding-left:34px}
.tl::before{content:"";position:absolute;left:12px;top:8px;bottom:8px;width:2px;background:#1f3a2c}
.tstep{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);box-shadow:var(--shadow);padding:12px 15px;margin-bottom:10px}
.tstep::before{content:"";position:absolute;left:-28px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(61,220,132,.12),0 0 10px rgba(61,220,132,.6)}
.tstep h4{font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tstep .tp{font-size:11.5px;color:var(--sub);margin-top:3px}
.tn{flex:none;width:22px;height:22px;border-radius:50%;background:rgba(61,220,132,.12);border:1px solid rgba(61,220,132,.4);color:var(--green);font-size:12px;font-weight:800;font-family:var(--mono);display:flex;align-items:center;justify-content:center}

/* ===== forms ===== */
.form-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.form-card .fh2{display:flex;align-items:center;gap:10px;margin-bottom:3px;flex-wrap:wrap}
.form-card h3{font-size:15px}
.form-note{font-size:12px;color:var(--sub);margin-bottom:12px}
.frow{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.flabel{flex:none;width:170px;font-size:13px;font-weight:600}
.fline{flex:1;border-bottom:1px solid #2e4256;height:1.2em}
.fdesc{font-size:11.5px;color:var(--sub);flex-basis:100%;padding-left:180px;margin-top:-4px}
@media(max-width:600px){.flabel{width:120px}.fdesc{padding-left:0}}
.pbtn{border:1px solid var(--blue);background:transparent;color:var(--blue);border-radius:8px;width:34px;height:34px;font-size:15px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.pbtn:hover{background:var(--blue);color:#061019}

/* ===== exceptions ===== */
.exc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:var(--rs);box-shadow:var(--shadow);padding:14px}
.exc h4{font-size:13.5px;margin-bottom:6px;display:flex;gap:7px;align-items:center}
.exc .fl{font-size:12.5px;color:#c4d2de}
.exc .fo{font-size:11.5px;color:var(--sub);margin-top:7px}

/* ===== footer ===== */
footer{margin:44px 0 30px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub)}
footer .flinks{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}
footer .note{margin-top:8px;line-height:1.6}

@media print{
  :root{--bg:#fff;--card:#fff;--ink:#111;--sub:#555;--line:#bbb;--amberbg:#fbf1dd;--redbg:#fcebe9;--greenbg:#e6f4ec;--bluebg:#e8f1fa;--shadow:none;--blue:#2b6cb0}
  body{background:#fff;background-image:none}
  header,.nav,.no-print,footer{display:none!important}
  body.pf #app>section{display:none!important}
  body.pf #sec-forms{display:block!important}
  body.pf .form-card{display:none!important;box-shadow:none;border:1px solid #bbb;break-inside:avoid}
  body.pf .form-card.printing{display:block!important}
  .pbtn{display:none!important}
  section{margin:0}
  .fline{border-color:#999}
  .fnode.rule{background:#fdecec}
}
</style>
</head>

    <div class="seg tseg" id="tseg"></div>
    <div class="seg" id="lseg"></div>
  </div>
</header>
<div id="app" class="wrap"></div>

function updCk(){const D=DATA[lang];const done=ckState();const el=document.getElementById('ckcnt');if(el){el.textContent=done.length+' / '+D.checklist.length+' '+esc(D.ckLabels.done);document.getElementById('ckbar').style.width=(done.length/D.checklist.length*100)+'%';}}
function bind(){
 document.querySelectorAll('#tseg button').forEach(b=>b.onclick=()=>{T=b.dataset.t;lsSet('ru151t',T);render();});
 document.querySelectorAll('#lseg button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;lsSet('ru151lang',lang);render();});
 document.querySelectorAll('.ck input').forEach(inp=>inp.onchange=()=>{const i=+inp.closest('.ck').dataset.i;let s=ckState();if(inp.checked){if(!s.includes(i))s.push(i);}else{s=s.filter(x=>x!==i);}lsSet('ru151ck',JSON.stringify(s));inp.closest('.ck').classList.toggle('done',inp.checked);updCk();});
 document.querySelectorAll('.pbtn').forEach(b=>b.onclick=()=>{const card=b.closest('.form-card');card.classList.add('printing');document.body.classList.add('pf');
  const clean=()=>{card.classList.remove('printing');document.body.classList.remove('pf');window.removeEventListener('afterprint',clean);};
  window.addEventListener('afterprint',clean);window.print();setTimeout(clean,1500);});
}
render();
</script>
